<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>4-7-8 Sleep Breath</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .circle-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      cursor: pointer;
    }

    /* Original Organic Outlined Blob */
    .blob {
      position: absolute;
      width: 200px;
      height: 200px;
      background: transparent;
      border: 2px solid #6366f1;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      box-shadow: 0 0 50px rgba(99, 102, 241, 0.25), inset 0 0 20px rgba(99, 102, 241, 0.1);
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), border-color 1.5s ease, box-shadow 1.5s ease;
      animation: morph 8s ease-in-out infinite, float 6s ease-in-out infinite;
    }

    @keyframes morph {
      0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
      34% { border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%; }
      67% { border-radius: 100% 60% 30% 70% / 60% 30% 70% 40%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Center Text Display (Replacing the face) */
    .center-display {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }

    .phase-label {
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 4px;
      transition: color 1.5s ease;
    }

    .timer-val {
      font-size: 2.2rem;
      font-weight: 200;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.9);
      font-variant-numeric: tabular-nums;
    }

    .cycle-count {
      position: absolute;
      bottom: 10%;
      z-index: 2;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.25);
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <canvas id="particle-canvas"></canvas>

    <div class="circle-wrapper" id="circleTrigger">
      <div class="blob" id="blob"></div>
      <div class="center-display">
        <div class="phase-label" id="phaseLabel">TAP TO</div>
        <div class="timer-val" id="timerVal">START</div>
      </div>
    </div>

    <div class="cycle-count" id="cycleCount">Cycles completed: 0</div>
  </div>

  <script>
    const blob = document.getElementById("blob");
    const phaseLabel = document.getElementById("phaseLabel");
    const timerVal = document.getElementById("timerVal");
    const cycleCount = document.getElementById("cycleCount");
    const circleTrigger = document.getElementById("circleTrigger");
    const canvas = document.getElementById("particle-canvas");
    const ctx = canvas.getContext("2d");

    let isRunning = false;
    let timer = null;
    let cycles = 0;
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 1.5 + 3 * Math.random();
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.alpha = 1;
        this.decay = 0.005 + 0.01 * Math.random();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function createBurst(color) {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      for (let i = 0; i < 30; i++) {
        particles.push(new Particle(centerX, centerY, color));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    const PHASES = [
      { name: "Inhale", duration: 4, color: "#818cf8", glow: "0 0 60px rgba(129, 140, 248, 0.5), inset 0 0 25px rgba(129, 140, 248, 0.2)", scale: 1.65 },
      { name: "Hold",   duration: 7, color: "#c084fc", glow: "0 0 70px rgba(192, 132, 252, 0.6), inset 0 0 30px rgba(192, 132, 252, 0.25)", scale: 1.65 },
      { name: "Exhale", duration: 8, color: "#2dd4bf", glow: "0 0 40px rgba(45, 212, 191, 0.35), inset 0 0 15px rgba(45, 212, 191, 0.15)", scale: 1 }
    ];

    let currentPhaseIdx = 0;
    let secondsLeft = 0;

    function startBreathing() {
      isRunning = true;
      runPhase(0);
    }

    function stopBreathing() {
      isRunning = false;
      clearTimeout(timer);
      blob.style.transform = "scale(1)";
      blob.style.borderColor = "#6366f1";
      blob.style.boxShadow = "0 0 50px rgba(99, 102, 241, 0.25)";
      
      phaseLabel.textContent = "TAP TO";
      timerVal.textContent = "START";
      phaseLabel.style.color = "rgba(255, 255, 255, 0.5)";
    }

    function runPhase(phaseIdx) {
      if (!isRunning) return;
      currentPhaseIdx = phaseIdx;
      const phase = PHASES[phaseIdx];
      secondsLeft = phase.duration;

      blob.style.transform = `scale(${phase.scale})`;
      blob.style.borderColor = phase.color;
      blob.style.boxShadow = phase.glow;
      
      phaseLabel.textContent = phase.name;
      phaseLabel.style.color = phase.color;

      createBurst(phase.color);

      const updateCountdown = () => {
        if (!isRunning) return;
        timerVal.textContent = secondsLeft;
        secondsLeft--;

        if (secondsLeft >= 0) {
          timer = setTimeout(updateCountdown, 1000);
        } else {
          if (phaseIdx === 2) {
            cycles++;
            cycleCount.textContent = `Cycles completed: ${cycles}`;
          }
          runPhase((phaseIdx + 1) % PHASES.length);
        }
      };

      updateCountdown();
    }

    circleTrigger.addEventListener("click", () => {
      if (isRunning) {
        stopBreathing();
      } else {
        startBreathing();
      }
    });
  </script>
</body>
</html>
